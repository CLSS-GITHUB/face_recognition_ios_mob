name: face_ios_android
description: "On-device face verification — Flutter port of the Android Native FaceVerfication app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & DI
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.7

  # Persistence
  drift: ^2.20.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Camera & ML pipeline (Phase 2 wiring; declared here so pub get is one cycle)
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.13.0
  google_mlkit_commons: ^0.10.0
  tflite_flutter: ^0.11.0
  image: ^4.3.0

  # Permissions & device posture
  permission_handler: ^11.3.1
  safe_device: ^1.1.10

  # Crypto / encrypted key storage
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0

  # Logging
  logging: ^1.3.0
  logger: ^2.4.0

  # Utilities
  uuid: ^4.5.0
  collection: ^1.18.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.20.2
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/models/
